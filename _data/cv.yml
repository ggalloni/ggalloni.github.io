    - name: CosmoForge — Power Spectrum and Likelihood Framework
      start_date: 2024
      end_date: present
      summary: Python framework for power-spectrum estimation and likelihood analysis on large-scale CMB
        data, designed as a unified tool for LiteBIRD, SO and future experiments.
    - name: BICEP Diagnosis with the marginalized HL Likelihood
      start_date: 2025
      end_date: present
      summary: Leading a re-analysis of BICEP data exploiting new capabilities of the marginalized Hamimeche
        & Lewis (mHL) likelihood, stress-testing existing constraints on tensor modes.
    Collaboration Projects:
    - bullet: '**Jun 2024 – present** LiteBIRD — Foreground and Sensitivity Studies. Interfacing my Python
        package with foreground-separation techniques and sensitivity analyses critical for assessing
