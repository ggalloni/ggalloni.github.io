        this analysis.'
    - bullet: '**Apr 2023 – present** LiteBIRD — Simulation Team. Validation tests on the products of
        the Simulations group, a cosmological analysis of CMB temperature with LiteBIRD, and development
        of parts of the litebird_sim repository.'
    - bullet: '**May 2022 – present** LiteBIRD — Tests on Cosmic Inflation. Monte Carlo study to understand
        which inflationary models can be detected by LiteBIRD.'
